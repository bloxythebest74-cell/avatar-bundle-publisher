
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avatar Bundle Publisher</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  background: #101014;
  color: white;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 500px;
  margin: auto;
}

h1 { font-size: 27px; }

p { color: #aaa; }

.card {
  background: #1c1c24;
  padding: 18px;
  border-radius: 14px;
  margin-top: 18px;
}

input, textarea {
  width: 100%;
  padding: 13px;
  margin: 8px 0 15px;
  border: 1px solid #393945;
  border-radius: 8px;
  background: #111118;
  color: white;
}

textarea {
  min-height: 90px;
  resize: vertical;
}

button {
  width: 100%;
  padding: 14px;
  border: 0;
  border-radius: 9px;
  background: #6655ff;
  color: white;
  font-size: 16px;
  font-weight: bold;
  margin-top: 10px;
}

button:disabled {
  opacity: 0.5;
}

.status {
  margin-top: 15px;
  padding: 12px;
  background: #111118;
  border-radius: 8px;
  overflow-wrap: anywhere;
}

.small {
  font-size: 12px;
  color: #888;
}
</style>
</head>

<body>
<div class="container">

<h1>Avatar Bundle Publisher</h1>
<p>Your personal Roblox avatar publishing dashboard.</p>

<div class="card">
<h3>Cloudflare Connection</h3>

<label>Worker URL</label>
<input id="api" value="https://avatar-bundle-publisher.r20119627.workers.dev">

<label>Private Token</label>
<input id="token" type="password" placeholder="Enter your PUBLISHER_TOKEN">

<button onclick="testConnection()">Test Connection</button>
<div class="status" id="connection">Not tested yet.</div>
</div>

<div class="card">
<h3>Avatar Information</h3>

<label>Bundle Name</label>
<input id="name" placeholder="My Avatar Bundle">

<label>Description</label>
<textarea id="description" placeholder="Describe your avatar..."></textarea>

<label>Avatar JSON File</label>
<input id="file" type="file" accept=".json,application/json">

<button onclick="saveAvatar()">Save Avatar Data</button>

<div class="status" id="result">Waiting for avatar data.</div>
</div>

<div class="card">
<h3>Publishing</h3>
<p>Actual Roblox bundle publishing is not connected yet.</p>
<button disabled>Publish to Roblox (Coming later)</button>
<p class="small">Saving avatar data does not publish a Roblox bundle.</p>
</div>

</div>

<script>
const $ = id => document.getElementById(id);

function getApi() {
  return $("api").value.trim().replace(/\/+$/, "");
}

function getHeaders() {
  return {
    "Content-Type": "application/json",
    "Authorization": "Bearer " + $("token").value.trim()
  };
}

async function testConnection() {
  $("connection").textContent = "Checking connection...";

  try {
    const response = await fetch(getApi() + "/health");
    const data = await response.json();

    $("connection").textContent =
      data.online ? "Worker is online!" : "Worker response received.";
  } catch (error) {
    $("connection").textContent =
      "Connection failed: " + error.message;
  }
}

async function saveAvatar() {
  const name = $("name").value.trim();
  const description = $("description").value.trim();
  const file = $("file").files[0];
  const token = $("token").value.trim();

  if (!name || !file || !token) {
    $("result").textContent =
      "Enter a bundle name, token, and select a JSON file.";
    return;
  }

  $("result").textContent = "Reading avatar file...";

  try {
    const avatar = JSON.parse(await file.text());

    $("result").textContent = "Saving avatar data...";

    const response = await fetch(getApi() + "/save", {
      method: "POST",
      headers: getHeaders(),
      body: JSON.stringify({
        name,
        description,
        avatar
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Save failed");
    }

    $("result").textContent =
      "Saved successfully! Avatar ID: " + data.id;

  } catch (error) {
    $("result").textContent =
      "Error: " + error.message;
  }
}
</script>

</body>
</html>
